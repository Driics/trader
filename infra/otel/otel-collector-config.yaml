receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch: {}

exporters:
  logging:
    loglevel: info
  otlp:                # send traces from Collector to Jaeger using OTLP gRPC
    endpoint: jaeger:4317
    tls:
      insecure: true
    # If you prefer HTTP instead of gRPC:
    # use 'otlphttp' exporter and endpoint: http://jaeger:4318

extensions:
  health_check: {}

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging, otlp]   # was [logging, jaeger]