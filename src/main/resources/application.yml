okx:
  http:
    client-type: ktor
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
    write-timeout-ms: 10000
    pool:
      max-connections: 200
      pending-acquire-max-count: 2000
      pending-acquire-timeout-ms: 5000

  api-key: ${OKX_API_KEY:your-okx-api-key}
  secret-key: ${OKX_API_SECRET:your-okx-secret}
  passphrase: ${OKX_API_PASSPHRASE:your-okx-passphrase}

# Trading Configuration
trading:
  currencies:
    - BTC
    - ETH
    - SOL
    - BNB
    - XRP
    - DOGE
  time-zone: UTC
  auto-execute: true
  max-concurrent-symbols: 10
  instrument-cache-ttl: 1h  # Aggressive caching: 1 hour TTL

# Cache Configuration
cache:
  warming:
    enabled: true  # Enable cache warming at startup

# Redis Configuration (optional - for distributed caching)
redis:
  enabled: false  # Set to true and add spring-boot-starter-data-redis dependency to enable Redis L2 cache

otel:
  service:
    name: "trading-system"

prompt.output-path: ./prompt.txt

ai:
  koog:
    openrouter:
      enabled: true
      api-keys: ${OPENROUTER_API_KEYS:key1,key2,key3}
      max-retries: 3
      retry-delay-ms: 1000
      base-url: https://openrouter.ai/api/v1

  custom:
    # Custom System Prompt
    system-prompt: |
      You are an expert cryptocurrency trading analyst. 
      Analyze the provided market data and generate clear, actionable trading signals in JSON format.

      Output Structure:
      - Single JSON object with coin symbols as keys (e.g., {"ETH": {...}, "SOL": {...}})
      - Each coin contains a "trade_signal_args" object

      For HOLD signals:
      - Include: coin, signal ("hold"), quantity (full current size), profit_target, stop_loss, invalidation_condition, leverage (5-40), confidence (0-1), risk_usd
      - Do NOT include "justification" field
      - Use existing position values without modification

      For BUY/SELL signals:
      - Include all fields above plus "justification"
      - Specify entry price, stop loss, and take profit

      Output only valid JSON, no additional prose. Don't add code tags(```) or other formatting.
      JSON format:
      Example for hold:
      {
        "COIN": {
          "trade_signal_args": {
            "coin": "COIN",
            "signal": "hold",
            "quantity": <full current size>,
            "profit_target": <float>,
            "stop_loss": <float>,
            "invalidation_condition": "<string>",
            "leverage": <int 5–40>,
            "confidence": <0–1>,   
            "risk_usd": <float>
          }
        }
      }

resilience4j:
  retry:
    instances:
      okxMarket:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        enable-randomized-wait: true
        randomized-wait-factor: 0.3
        retry-exceptions:
          - io.ktor.client.plugins.HttpRequestTimeoutException
          - java.net.ConnectException
          - java.io.IOException
      okxAccount:
        max-attempts: 2
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - java.net.ConnectException
      okxTrade:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - java.util.concurrent.TimeoutException

  circuitbreaker:
    instances:
      okxMarket:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.util.concurrent.TimeoutException
      okxAccount:
        sliding-window-size: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      okxTrade:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2

  ratelimiter:
    instances:
      okxMarket:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0
      okxAccount:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 0
      okxTrade:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,resilience4j
  metrics:
    tags:
      application: ${spring.application.name:aiTrader}
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true