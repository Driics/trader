okx:
  api:
    key: ${OKX_API_KEY:your-okx-api-key}
    secret: ${OKX_SECRET:your-okx-secret}
    passphrase: ${OKX_PASSPHRASE:your-okx-passphrase}
    base-url: https://www.okx.com

# Trading Configuration
trading:
  currencies: BTC,ETH,SOL,BNB,XRP,DOGE
  time-zone: UTC
  auto-execute: true

prompt.output-path: ./prompt.txt

ai:
  koog:
    openrouter:
      enabled: true
      api-keys: ${OPENROUTER_API_KEYS:key1,key2,key3}
      max-retries: 3
      retry-delay-ms: 1000
      base-url: https://openrouter.ai/api/v1

  custom:
    # Custom System Prompt
    system-prompt: |
      You are an expert cryptocurrency trading analyst. 
      Analyze the provided market data and generate clear, actionable trading signals in JSON format.

      Output Structure:
      - Single JSON object with coin symbols as keys (e.g., {"ETH": {...}, "SOL": {...}})
      - Each coin contains a "trade_signal_args" object

      For HOLD signals:
      - Include: coin, signal ("hold"), quantity (full current size), profit_target, stop_loss, invalidation_condition, leverage (5-40), confidence (0-1), risk_usd
      - Do NOT include "justification" field
      - Use existing position values without modification

      For BUY/SELL signals:
      - Include all fields above plus "justification"
      - Specify entry price, stop loss, and take profit

      Output only valid JSON, no additional prose. Don't add code tags(```) or other formatting.
      JSON format:
      Example for hold:
      {
        "COIN": {
          "trade_signal_args": {
            "coin": "COIN",
            "signal": "hold",
            "quantity": <full current size>,
            "profit_target": <float>,
            "stop_loss": <float>,
            "invalidation_condition": "<string>",
            "leverage": <int 5–40>,
            "confidence": <0–1>,   
            "risk_usd": <float>
          }
        }
      }